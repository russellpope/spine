schema = 0

# spine:begin gate-pack go@1
# spine manages this region. Change it through the gate_pack keys in
# WORKFLOW.md and re-run `spine update`, never by hand.
# Compose the pack into your own lane with a stage: pipeline = "gate-go"
# and the advisory battery with: pipeline = "mutation-go"

[pipelines.gate-go]
profile = "full"

[[pipelines.gate-go.stage]]
name = "binary-hygiene"
run = "spine gate go binary-hygiene"

[[pipelines.gate-go.stage]]
name = "dead-code-callgraph"
run = "spine gate go dead-code-callgraph"

[[pipelines.gate-go.stage]]
name = "deferred-cleanup-errcheck"
run = "spine gate go deferred-cleanup-errcheck"

[[pipelines.gate-go.stage]]
name = "gitignore-control"
run = "spine gate go gitignore-control"
env = { SPINE_GATE_BUILD_OUTPUTS = "bin/spine" }

[[pipelines.gate-go.stage]]
name = "tskip"
run = "spine gate go tskip"
env = { SPINE_GATE_TSKIP_ALLOW = "cmd/spine/dogfood_test.go,internal/cursor/dogfood_test.go" }

[pipelines.mutation-go]
profile = "audit"

[[pipelines.mutation-go.stage]]
name = "mutate"
run = "spine gate go mutate"
# spine:end

# spine repo lanes (owner-managed; the region above is spine-managed)
[pipelines.fast]
description = "vet + test"
profile = "fast"

[[pipelines.fast.stage]]
name = "vet"
run = "go vet ./..."
timeout = "3m"

[[pipelines.fast.stage]]
name = "test"
run = "go test ./..."
needs = ["vet"]
timeout = "10m"

[pipelines.full]
description = "fast lane + go@1 gate pack"
profile = "full"

[[pipelines.full.stage]]
name = "fast"
pipeline = "fast"

[[pipelines.full.stage]]
name = "gates"
pipeline = "gate-go"
needs = ["fast"]

# No audit lane composing `mutation-go` — deliberate, recorded 2026-08-20
# under I099. ADR 0016 asks the repo to compose the advisory battery with a
# `pipeline = "mutation-go"` stage, but the scaffolding that writes an audit
# lane is maipipe-side (its ticket I204, open, blocked by I202+I203). A lane
# hand-written here would be work I204 then has to reconcile, so until it
# lands the battery is run by name: `maipipe run mutation-go`. See ADR 0016's
# Consequences.
