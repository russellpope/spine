schema = 0

# spine:begin gate-pack go@1
# spine manages this region. Change it through the gate_pack keys in
# WORKFLOW.md and re-run `spine update`, never by hand.
# Compose the pack into your own lane with a stage: pipeline = "gate-go"
# and the advisory battery with: pipeline = "mutation-go"

[pipelines.gate-go]
profile = "full"

[[pipelines.gate-go.stage]]
name = "binary-hygiene"
run = "spine gate go@1 binary-hygiene"

[[pipelines.gate-go.stage]]
name = "dead-code-callgraph"
run = "spine gate go@1 dead-code-callgraph"

[[pipelines.gate-go.stage]]
name = "deferred-cleanup-errcheck"
run = "spine gate go@1 deferred-cleanup-errcheck"

[[pipelines.gate-go.stage]]
name = "gitignore-control"
run = "spine gate go@1 gitignore-control"
env = { SPINE_GATE_BUILD_OUTPUTS = "bin/spine" }

[[pipelines.gate-go.stage]]
name = "tskip"
run = "spine gate go@1 tskip"
env = { SPINE_GATE_TSKIP_ALLOW = "cmd/spine/dogfood_test.go,internal/cursor/dogfood_test.go" }

[pipelines.mutation-go]
profile = "audit"

[[pipelines.mutation-go.stage]]
name = "mutate"
run = "spine gate go@1 mutate"
# spine:end

# spine repo lanes (owner-managed; the region above is spine-managed)
[pipelines.fast]
description = "vet + test"
profile = "fast"

[[pipelines.fast.stage]]
name = "vet"
run = "go vet ./..."
timeout = "3m"

[[pipelines.fast.stage]]
name = "test"
run = "go test ./..."
needs = ["vet"]
timeout = "10m"

[pipelines.full]
description = "fast lane + go@1 gate pack"
profile = "full"

[[pipelines.full.stage]]
name = "fast"
pipeline = "fast"

[[pipelines.full.stage]]
name = "gates"
pipeline = "gate-go"
needs = ["fast"]

# No audit lane composing `mutation-go` — deliberate, recorded 2026-08-20
# under issue I099. The gate pack asks each repo to compose the advisory
# mutation battery itself, with a stage `pipeline = "mutation-go"` in an
# audit lane. No repo does, spine included: the scaffolding that writes an
# audit lane is maipipe's to build (its ticket I204 — open, blocked by
# I202+I203), and a lane hand-written here would be work I204 then has to
# reconcile. Until I204 lands, run the battery by name:
#     maipipe run mutation-go
# Owner of the gap: maipipe I204. Background: docs/issues/I099, and the
# Consequences of the ADR covering spine's region in this file.
